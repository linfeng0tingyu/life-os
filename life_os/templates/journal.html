{% extends "base.html" %}

{% block title %}日记 · Life OS{% endblock %}

{% block body %}
  <div class="app-shell" data-app-root data-page="journal">
    {% include "partials/sidebar.html" %}
    <main class="main-content records-content" id="main-content">
      <header class="topbar page-head">
        <div><p class="eyebrow">给每天留下一段可回看的文字</p><h1>日记</h1><p class="date-subtitle">支持 Markdown 文本；停止输入约 1.2 秒后自动保存。</p></div>
        <label class="date-switcher"><span>日记日期</span><input type="date" data-record-date></label>
      </header>
      <div class="notice is-hidden" role="alert" data-global-error>
        <div><strong>日记未能保存</strong><p data-global-error-message></p></div>
        <button class="button button-secondary" type="button" data-action="retry-journal">重试保存</button>
      </div>
      <section class="module module-notes journal-editor" aria-labelledby="journal-editor-title">
        <div class="module-heading">
          <div><p class="section-kicker" data-journal-date-label>所选日期</p><h2 id="journal-editor-title">今日文字</h2></div>
          <span class="save-state" data-journal-state role="status" aria-live="polite">正在读取</span>
        </div>
        <div class="journal-toolbar" role="toolbar" aria-label="日记格式和插入工具">
          <button class="button button-quiet" type="button" data-action="insert-time" title="插入当前系统时间">＋ 当前时间</button>
          <button class="button button-quiet" type="button" data-action="heading-1" title="一级标题">H1</button>
          <button class="button button-quiet" type="button" data-action="heading-2" title="二级标题">H2</button>
          <button class="button button-quiet" type="button" data-action="heading-3" title="三级标题">H3</button>
          <button class="button button-quiet" type="button" data-action="insert-image">插入图片</button>
          <button class="button button-secondary toolbar-export" type="button" data-action="export-journal">导出 Markdown</button>
          <input class="is-hidden" type="file" accept="image/png,image/jpeg,image/gif,image/webp" data-journal-image aria-label="选择日记图片">
        </div>
        <div class="journal-workspace">
          <div class="journal-pane">
            <p class="journal-pane-label">Markdown 编辑</p>
            <textarea data-journal-content maxlength="500000" aria-label="日记内容" placeholder="# 今天\n\n写下发生的事、当时的感受，以及想留给未来自己的话。"></textarea>
          </div>
          <section class="journal-pane journal-preview-pane" aria-label="Markdown 预览">
            <p class="journal-pane-label">实时预览</p>
            <div class="markdown-preview" data-journal-preview></div>
          </section>
        </div>
        <div class="editor-meta"><span data-journal-count>0 字符</span><span data-journal-saved-at>尚未保存</span></div>
      </section>
    </main>
  </div>
{% endblock %}

{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/app.js', v=app_version) }}"></script>{% endblock %}
