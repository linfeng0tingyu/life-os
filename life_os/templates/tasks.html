{% extends "base.html" %}

{% block title %}任务 · Life OS{% endblock %}

{% block body %}
  <div class="app-shell" data-app-root data-page="tasks">
    {% include "partials/sidebar.html" %}
    <main class="main-content management-content" id="main-content">
      <header class="topbar page-head">
        <div>
          <p class="eyebrow">把事项放进可靠的流程</p>
          <h1>任务</h1>
          <p class="date-subtitle">集中管理无日期、计划、到期和逾期事项，并完成状态流转与归档。</p>
        </div>
        <button class="button button-primary" type="button" data-action="new-task">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          新建任务
        </button>
      </header>

      <div class="notice is-hidden" role="alert" data-global-error>
        <div><strong>任务操作未完成</strong><p data-global-error-message></p></div>
        <button class="button button-secondary" type="button" data-action="retry-tasks">重试读取</button>
      </div>

      <section class="management-layout" aria-label="任务管理工作区">
        <aside class="module management-editor" aria-labelledby="task-form-title">
          <div class="module-heading compact">
            <div><p class="section-kicker">任务资料</p><h2 id="task-form-title" data-task-form-title>新建任务</h2></div>
            <span class="save-state" role="status" aria-live="polite" data-task-form-state>可编辑</span>
          </div>
          <form data-task-form>
            <input type="hidden" name="task_id">
            <label class="field"><span>标题</span><input type="text" name="title" maxlength="300" required placeholder="例如：整理本周采购清单"></label>
            <label class="field"><span>说明</span><textarea name="description" maxlength="5000" rows="3" placeholder="补充目标、背景或下一步"></textarea></label>
            <div class="field-grid">
              <label class="field"><span>状态</span><select name="status"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option><option value="cancelled">已取消</option></select></label>
              <label class="field"><span>优先级</span><select name="priority"><option value="normal">普通</option><option value="high">重要</option><option value="urgent">紧急</option><option value="low">低</option></select></label>
            </div>
            <label class="field"><span>分类</span><input type="text" name="category" maxlength="100" placeholder="例如：家庭、学习、工作"></label>
            <div class="field-grid">
              <label class="field"><span>计划日期</span><input type="date" name="scheduled_date"></label>
              <label class="field"><span>截止日期</span><input type="date" name="due_date"></label>
            </div>
            <label class="field"><span>父任务</span><select name="parent_id" data-task-parent><option value="">无父任务</option></select></label>
            <div class="form-actions">
              <button class="button button-primary" type="submit">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"></path><path d="M8 4v6h8V4M8 20v-6h8v6"></path></svg>
                保存任务
              </button>
              <button class="button button-quiet is-hidden" type="button" data-action="cancel-task-edit">取消编辑</button>
            </div>
          </form>
        </aside>

        <section class="module management-list" aria-labelledby="task-list-title">
          <div class="module-heading">
            <div><p class="section-kicker">执行清单</p><h2 id="task-list-title">全部任务</h2></div>
            <span class="state-label" role="status" aria-live="polite" data-task-list-state>加载中</span>
          </div>
          <div class="filter-bar">
            <label class="field"><span>搜索</span><input type="search" data-task-search placeholder="搜索标题、分类或说明"></label>
            <label class="field"><span>状态</span><select data-task-status-filter><option value="all">全部状态</option><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option><option value="cancelled">已取消</option></select></label>
            <label class="field"><span>关联日期</span><input type="date" data-task-date-filter></label>
            <label class="check-field filter-check"><input type="checkbox" data-task-show-archived>显示已归档</label>
          </div>
          <div data-task-list aria-busy="true"><p class="empty-state">正在读取任务…</p></div>
        </section>
      </section>
    </main>
  </div>
{% endblock %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='js/app.js', v=app_version) }}"></script>
{% endblock %}
