<aside class="sidebar" aria-label="主导航">
  <a class="brand" href="{{ url_for('system.index') }}" aria-label="Life OS 今日">
    <img class="brand-logo" src="{{ url_for('static', filename='images/life-os-logo.png', v=app_version) }}" alt="" aria-hidden="true">
    <span class="brand-copy"><strong>Life OS</strong><span>个人生活系统</span></span>
  </a>
  <nav class="primary-nav" aria-label="核心模块">
    <a class="nav-link{% if active_page == 'today' %} is-active{% endif %}" href="{{ url_for('system.index') }}"{% if active_page == 'today' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9 21v-6h6v6"></path></svg><span>今日</span>
    </a>
    <a class="nav-link{% if active_page == 'calendar' %} is-active{% endif %}" href="{{ url_for('system.calendar_page') }}"{% if active_page == 'calendar' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v3M19 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"></path></svg><span>日历</span>
    </a>
    <a class="nav-link{% if active_page == 'tasks' %} is-active{% endif %}" href="{{ url_for('system.tasks_page') }}"{% if active_page == 'tasks' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="m8 12 2.2 2.2L16 8.5"></path></svg><span>任务</span>
    </a>
    <a class="nav-link{% if active_page == 'habits' %} is-active{% endif %}" href="{{ url_for('system.habits_page') }}"{% if active_page == 'habits' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg><span>习惯</span>
    </a>
    <a class="nav-link{% if active_page == 'health' %} is-active{% endif %}" href="{{ url_for('system.health_page') }}"{% if active_page == 'health' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h3l2-5 3 10 2-5h6"></path><path d="M5 5h14v14H5z"></path></svg><span>节律</span>
    </a>
    <a class="nav-link{% if active_page == 'journal' %} is-active{% endif %}" href="{{ url_for('system.journal_page') }}"{% if active_page == 'journal' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg><span>记录</span>
    </a>
    <a class="nav-link{% if active_page == 'finance' %} is-active{% endif %}" href="{{ url_for('system.finance_page') }}"{% if active_page == 'finance' %} aria-current="page"{% endif %}>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4z"></path><path d="M7 7V5h10v2M8 12h8M8 15h5"></path></svg><span>财务</span>
    </a>
  </nav>
  <div class="theme-control">
    <label for="theme-select">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a2.3 2.3 0 0 0 0-4.6h-1.1a1.7 1.7 0 0 1 0-3.4H15A6 6 0 0 0 15 3Z"></path><circle cx="7.4" cy="10" r=".7"></circle><circle cx="9" cy="6.8" r=".7"></circle><circle cx="13" cy="5.8" r=".7"></circle></svg>
      <span>界面风格</span>
    </label>
    <select id="theme-select" data-theme-select aria-describedby="theme-hint">
      <option value="default">默认</option>
      <option value="bamboo">古风竹青</option>
      <option value="indigo">古风藏青</option>
      <option value="water">古风水色</option>
      <option value="neumorphism">新拟物派</option>
      <option value="macos-glass">macOS 毛玻璃</option>
      <option value="ghibli">吉卜力风格</option>
    </select>
    <span class="theme-hint" id="theme-hint" data-theme-status aria-live="polite">只改变外观，不改变数据</span>
  </div>
  <div class="sidebar-foot"><span class="privacy-dot" aria-hidden="true"></span>数据仅保存在本机运行目录</div>
</aside>
