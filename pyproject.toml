[project]
name = "life-os"
version = "0.1.0.dev0"
description = "Local-first personal life management system"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "waitress>=3.0.2,<4.0",
    "pywebview>=6.2.1,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
