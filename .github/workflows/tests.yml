name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check JavaScript modules
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\check_javascript.ps1
      - name: Run tests
        run: python -m pytest
